<style>

<script>
(function() {
'use strict';

// ============================================================
// CONFIG
// ============================================================
const AVATARS = ['🐱', '🐶', '🐰', '🐼', '🦊', '🐯', '🐨', '🐵', '🐷', '🐮', '🦁', '🐸'];
const GAME_DURATION_MS = 240000; // 240 秒一局

// ============================================================
// STATE
// ============================================================
let phase = 'init';
let isSolo = false;
let mySeat = null;       // 'A' | 'B' | null
let myUid = '';
let pc = null;            // RTCPeerConnection
let dc = null;            // RTCDataChannel
let pendingIce = [];
let seats = { A: null, B: null };
let signalingActive = false;
let soloHighScore = 0;
try { soloHighScore = parseInt(localStorage.getItem('wmbSoloHigh') || '0', 10) || 0; } catch (e) {}
// ★ 用 sessionStorage 而不是 localStorage：同标签刷新 uid 不变，但不同标签 = 不同玩家。
// 之前用 localStorage 导致同 profile 多标签共享 uid，多人对战变成自己跟自己玩，准备永远凑不齐。
try {
  myUid = sessionStorage.getItem('wmbUid');
  if (!myUid) { myUid = 'u_' + Math.random().toString(36).slice(2, 12); sessionStorage.setItem('wmbUid', myUid); }
} catch (e) { myUid = 'u_' + Math.random().toString(36).slice(2, 12); }
let myAvatarIdx = Math.floor(Math.random() * AVATARS.length);
let myAvatar = AVATARS[myAvatarIdx];
let oppAvatar = '⏳';
let oppName = '对手';
let myReady = false;
let oppReady = false;
let oppConnected = false;
let countdownEnd = 0;
let lastSyncSent = 0;
let gameEndTime = 0; // performance.now() at which the 240s round ends

const $ = id => document.getElementById(id);

function dlog(msg) {
  console.log('[wmb]', msg);
  const el = $('debugLog');
  if (el) {
    const time = new Date().toLocaleTimeString();
    const line = `[${time}] ${msg}`;
    el.innerHTML = line + '<br>' + el.innerHTML;
    el.innerHTML = el.innerHTML.split('<br>').slice(0, 20).join('<br>');
  }
}

// ============================================================
// ROOM CODE
// ============================================================
// (genCode removed — no more room codes)

// (shareUrl removed — no more room codes)

// ============================================================
// NETWORKING
// ============================================================
function whenFbReady() {
  if (window.fbReady) return Promise.resolve(window.fb);
  return new Promise(resolve => {
    document.addEventListener('firebase-ready', () => resolve(window.fb), { once: true });
  });
}

async function initNetwork() {
  $('loadingText').textContent = '正在连接服务器...';
  dlog('等待 Firebase 初始化');
  let fb;
  try {
    fb = await whenFbReady();
    dlog('Firebase 已就绪');
  } catch (e) {
    showError('Firebase 加载失败: ' + e.message);
    return;
  }
  
  // Initialize lobby state to 'waiting'
  try {
    const stateInitRef = fb.ref(fb.db, 'lobby/state');
    const stateSnap = await fb.get(stateInitRef);
    if (!stateSnap.val()) {
      await fb.set(stateInitRef, 'waiting');
      dlog('初始化 lobby/state 为 waiting');
    }
  } catch (e) {
    dlog('初始化 lobby/state 失败: ' + e.message);
  }
  
  // Subscribe to seats
  const seatsRef = fb.ref(fb.db, 'lobby/seats');
  fb.onValue(seatsRef, (snap) => {
    const v = snap.val() || {};
    seats = { A: v.A || null, B: v.B || null };
    onSeatsChange();
  }, (err) => {
    dlog('seats listen error: ' + err.message);
    showError('数据库读取失败：' + err.message);
  });
  // Subscribe to game state for start signal
  const stateRef = fb.ref(fb.db, 'lobby/state');
  let lastStateVal = null;
  let stateListenerActive = false;
  // ★ 用 startsWith('starting') 判断：每次开始信号都带时间戳后缀（如 'starting:1730290000000'）
  // 这样 set() 永远是一个新值，Firebase 的 onValue 一定会触发；不会因为上一局残留的
  // 'starting' 状态导致新一局的 set 同值无效。
  fb.onValue(stateRef, (snap) => {
    const s = snap.val();
    lastStateVal = s;
    if (!stateListenerActive) {
      stateListenerActive = true;
      dlog('✓ Firebase 状态监听器已激活');
    }
    dlog(`Firebase state 更新: ${s}, phase: ${phase}`);
    const isStarting = (typeof s === 'string') && s.startsWith('starting');
    if (isStarting && phase === 'lobby') {
      dlog('✓ 收到 Firebase "starting" 信号 → 启动倒计时');
      startCountdown();
    }
  }, (err) => {
    dlog('Firebase 状态监听错误: ' + err.message);
  });
  
  // 备用机制：每 500ms 检查一次是否应该启动
  // 这是为了处理 Firebase 监听延迟或失败的情况
  const startupCheckInterval = setInterval(() => {
    if (phase !== 'lobby') {
      clearInterval(startupCheckInterval);
      return;
    }
    // 检查本地状态是否满足启动条件
    if (seats.A && seats.B && seats.A.ready && seats.B.ready) {
      const lastIsStarting = (typeof lastStateVal === 'string') && lastStateVal.startsWith('starting');
      if (!lastIsStarting) {
        dlog('⚠ Firebase 状态未更新为 starting，使用本地备用启动机制');
        // 只在 A 座位写入状态
        if (mySeat === 'A') {
          try {
            fb.set(fb.ref(fb.db, 'lobby/state'), 'starting:' + Date.now());
            dlog('A 座位强制写入 starting 状态');
          } catch (e) {
            dlog('备用写入失败: ' + e.message);
          }
        }
      }
    }
  }, 500);
  
  // Show lobby UI right away
  onMyPeerReady();
}

function onSeatsChange() {
  if (!seats) return;
  // If I'm seated and my seat got cleared (e.g. by opponent's leave), reset
  if (mySeat && (!seats[mySeat] || seats[mySeat].uid !== myUid)) {
    mySeat = null;
    myReady = false;
    dlog('我的座位被清除或被占用');
  }
  const otherSeat = mySeat === 'A' ? 'B' : (mySeat === 'B' ? 'A' : null);
  const otherData = otherSeat ? seats[otherSeat] : null;
  const oldOppConn = oppConnected;
  oppConnected = !!otherData;
  if (otherData) {
    oppAvatar = otherData.avatar || '🐶';
    oppReady = !!otherData.ready;
  } else {
    oppAvatar = '⏳';
    oppReady = false;
  }
  // If both seats filled and we just got an opponent, set up WebRTC
  if (mySeat && otherData && !signalingActive) {
    dlog('双方入坐，设置 WebRTC');
    signalingActive = true;
    setupWebRTC();
  }
  // If opponent left mid-game
  if (!otherData && oldOppConn && (phase === 'playing' || phase === 'countdown')) {
    onOppLeft();
  }
  // ★ BUGFIX: 双方都入坐就把 phase 切到 'lobby'。原版只在 onOppConnected 里切，
  // 但 onOppConnected 是孤儿函数从来没被调用，导致 maybeStartCountdown 全部被
  // 守卫拦下、游戏永远不开始。这里和 WebRTC 解耦，更稳。
  if (mySeat && otherData && phase === 'waiting') {
    phase = 'lobby';
    dlog('★ 双方就位，phase → lobby');
  }
  // 任意一方离开则退回 waiting
  if ((!mySeat || !otherData) && phase === 'lobby') {
    phase = 'waiting';
    dlog('★ 座位空缺，phase → waiting');
  }
  updateLobbyUI();
  // 座位变化时检查是否可以启动游戏
  dlog(`座位变化: A=${!!seats.A} (ready=${seats.A?.ready || false}), B=${!!seats.B} (ready=${seats.B?.ready || false}), phase=${phase}`);
  maybeStartCountdown();
  // 延迟再检查一次，以处理时序问题
  setTimeout(() => maybeStartCountdown(), 200);
}

async function claimSeat(seatId) {
  if (mySeat) return;
  const fb = window.fb;
  if (!fb) return;
  const seatRef = fb.ref(fb.db, `lobby/seats/${seatId}`);
  try {
    const result = await fb.runTransaction(seatRef, (current) => {
      if (current && current.uid !== myUid) return; // already taken
      return { uid: myUid, avatar: myAvatar, ready: false, ts: fb.serverTimestamp() };
    });
    if (result.committed) {
      mySeat = seatId;
      dlog(`已入坐 ${seatId}`);
      // Set up cleanup on disconnect
      try {
        await fb.onDisconnect(seatRef).remove();
        // Also clean signaling for my seat on disconnect
        const sigRef = fb.ref(fb.db, `lobby/signal/${seatId}-to-${seatId === 'A' ? 'B' : 'A'}`);
        await fb.onDisconnect(sigRef).remove();
      } catch (e) { dlog('onDisconnect 设置失败: ' + e.message); }
      updateLobbyUI();
    } else {
      dlog(`入坐失败：${seatId} 已被占用`);
    }
  } catch (e) {
    dlog('claimSeat error: ' + e.message);
    showError('入坐失败: ' + e.message);
  }
}

async function leaveSeat(updateUI = true) {
  if (!mySeat || !window.fb) { mySeat = null; return; }
  const fb = window.fb;
  const seatId = mySeat;
  mySeat = null;
  myReady = false;
  signalingActive = false;
  try {
    dlog(`离开座位 ${seatId}，清理数据`);
    await fb.remove(fb.ref(fb.db, `lobby/seats/${seatId}`));
    await fb.remove(fb.ref(fb.db, `lobby/signal/${seatId}-to-${seatId === 'A' ? 'B' : 'A'}`));
    await fb.remove(fb.ref(fb.db, `lobby/signal/${seatId === 'A' ? 'B' : 'A'}-to-${seatId}`));
    // 重置状态为 'waiting'（防止旧的 'starting' 状态干扰）
    await fb.set(fb.ref(fb.db, 'lobby/state'), 'waiting');
    dlog('重置 lobby/state 为 waiting');
  } catch (e) { dlog('leaveSeat: ' + e.message); }
  closeWebRTC();
  if (updateUI) updateLobbyUI();
}

async function setReady(state) {
  if (!mySeat || !window.fb) return;
  const fb = window.fb;
  myReady = state;
  try {
    await fb.set(fb.ref(fb.db, `lobby/seats/${mySeat}/ready`), state);
    dlog(`设置 ${mySeat} 座位 ready=${state}`);
    // 准备状态更改后立即检查是否可以启动游戏
    if (state) {
      setTimeout(() => maybeStartCountdown(), 10);
      // 再次检查，以防 Firebase 监听器延迟
      setTimeout(() => maybeStartCountdown(), 300);
      setTimeout(() => maybeStartCountdown(), 800);
    }
  } catch (e) { dlog('setReady: ' + e.message); }
}

async function setMyAvatar(av) {
  myAvatar = av;
  if (mySeat && window.fb) {

      await window.fb.set(window.fb.ref(window.fb.db, `lobby/seats/${mySeat}/avatar`), av);

// =============== WebRTC setup ===============
async function setupWebRTC() {
  if (!mySeat) return;
  const otherSeat = mySeat === 'A' ? 'B' : 'A';
  const fb = window.fb;
  dlog(`建立 WebRTC 连接 (我=${mySeat})`);

  pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' }
    ]
  });

  pc.onicecandidate = (e) => {
    if (e.candidate) {
      const path = `lobby/signal/${mySeat}-to-${otherSeat}/ice`;
      const iceRef = fb.push(fb.ref(fb.db, path));
      fb.set(iceRef, e.candidate.toJSON());
    }
  };
  pc.oniceconnectionstatechange = () => {
    dlog(`ICE state: ${pc.iceConnectionState}`);
  };
  pc.onconnectionstatechange = () => {
    dlog(`PC state: ${pc.connectionState}`);
    if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
      dlog('WebRTC 连接断开');
    }
  };
  pc.ondatachannel = (e) => {
    setupDataChannel(e.channel);
  };

  // Listen for incoming ICE
  const iceListenRef = fb.ref(fb.db, `lobby/signal/${otherSeat}-to-${mySeat}/ice`);
  fb.onChildAdded(iceListenRef, async (snap) => {
    const c = snap.val();
    if (!c) return;
    try {
      if (pc.remoteDescription) {
        await pc.addIceCandidate(new RTCIceCandidate(c));
      } else {
        pendingIce.push(c);
      }
    } catch (err) {
      dlog('addIce error: ' + err.message);
    }
  });

  if (mySeat === 'A') {
    // Initiator: create data channel + offer
    const channel = pc.createDataChannel('game', { ordered: true });
    setupDataChannel(channel);
    try {
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await fb.set(fb.ref(fb.db, `lobby/signal/A-to-B/sdp`), { type: 'offer', sdp: offer.sdp });
      dlog('已发送 offer');
    } catch (e) { dlog('offer error: ' + e.message); }
    // Listen for answer
    fb.onValue(fb.ref(fb.db, `lobby/signal/B-to-A/sdp`), async (snap) => {
      const v = snap.val();
      if (v && v.type === 'answer' && pc && pc.signalingState === 'have-local-offer') {
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(v));
          dlog('收到 answer');
          for (const c of pendingIce) {
            try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
          }
          pendingIce = [];
        } catch (err) { dlog('setRemoteDesc(answer) error: ' + err.message); }
      }
    });
  } else {
    // Answerer: wait for offer
    fb.onValue(fb.ref(fb.db, `lobby/signal/A-to-B/sdp`), async (snap) => {
      const v = snap.val();
      if (v && v.type === 'offer' && pc && !pc.remoteDescription) {
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(v));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          await fb.set(fb.ref(fb.db, `lobby/signal/B-to-A/sdp`), { type: 'answer', sdp: answer.sdp });
          dlog('已发送 answer');
          for (const c of pendingIce) {
            try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {}
          }
          pendingIce = [];
        } catch (err) { dlog('answer error: ' + err.message); }
      }
    });
  }
}

function setupDataChannel(channel) {
  dc = channel;
  dc.onopen = () => {
    dlog('数据通道已打开');
    send({ t: 'hi', avatar: myAvatar });
    // 数据通道打开后检查是否可以启动游戏
    maybeStartCountdown();
  };
  dc.onmessage = (e) => {
    try { handleMsg(JSON.parse(e.data)); } catch (err) {}
  };
  dc.onclose = () => {
    dlog('数据通道关闭');
  };
  dc.onerror = (err) => {
    dlog('数据通道错误');
    console.error(err);
  };
}

function closeWebRTC() {
  try { if (dc) dc.close(); } catch (e) {}
  try { if (pc) pc.close(); } catch (e) {}
  pc = null; dc = null; pendingIce = [];
}

function triggerStart() {
  // A side broadcasts start to B via data channel; both sides start their own countdown
  send({ t: 'start' });
  if (phase === 'lobby') startCountdown();
}

function maybeStartCountdown() {
  if (phase !== 'lobby') {
    return;
  }
  
  // 检查两个座位是否都满员且都准备就绪
  const readyToStart = seats.A && seats.B && seats.A.ready && seats.B.ready;
  
  if (!readyToStart) {
    return;
  }
  
  dlog(`🎮 启动条件满足: 双方准备就绪。我的座位=${mySeat}`);
  
  // 只有 A 座位负责写入启动状态到 Firebase；带时间戳确保每次都是新值
  if (mySeat === 'A' && window.fb) {
    const signal = 'starting:' + Date.now();
    dlog('→ A 座位写入 "' + signal + '" 到 Firebase');
    try {
      window.fb.set(window.fb.ref(window.fb.db, 'lobby/state'), signal);
    } catch (e) {
      dlog('✗ 写入失败: ' + e.message);
    }
  } else if (mySeat === 'B') {
    dlog('→ B 座位等待 Firebase 信号');
  }
}

function send(msg) {
  if (dc && dc.readyState === 'open') {
    try { dc.send(JSON.stringify(msg)); } catch (e) {}
  }
}

function handleMsg(msg) {
  if (msg.t === 'hi') {
    // No-op: avatars sync via Firebase
  } else if (msg.t === 'start') {
    if (phase === 'lobby') startCountdown();
  } else if (msg.t === 'state') {
    if (phase === 'playing' || phase === 'gameover') {
      opp.fruits = (msg.f || []).map(([x, y, type]) => ({ x, y, type }));
      opp.score = msg.s || 0;
      opp.alive = msg.a !== 0;
      opp.maxFruit = msg.m || 0;
    }
  } else if (msg.t === 'lost') {
    onOppLost(msg.score || 0);
  } else if (msg.t === 'won') {
    // 对手合成大西瓜 → 我直接输
    onOppWon(msg.score || 0);
  } else if (msg.t === 'leave') {
    onOppDisconnected();
  }
}

function setStatus(text, cls) {
  const el = $('lobbyStatus');
  if (!el) return;
  el.textContent = text;
  el.classList.remove('go', 'warn');
  if (cls) el.classList.add(cls);
}

function updateLobbyUI() {
  if (!$('seatA')) return;
  for (const s of ['A', 'B']) {
    const el = $('seatedSeat' + s) || $('seat' + s);
    const avatarEl = $('avatar' + s);
    const nameEl = $('name' + s);
    const statusEl = $('status' + s);
    const readyBtn = $('readyBtn' + s);
    const data = seats[s];
    el.classList.remove('empty', 'mine', 'opponent');
    // Remove old leave button if any
    const oldLeave = el.querySelector('.seat-leave');
    if (oldLeave) oldLeave.remove();
    if (!data) {
      el.classList.add('empty');
      avatarEl.textContent = '🪑';
      nameEl.textContent = '空座位';
      statusEl.textContent = '点我入坐';
      statusEl.classList.remove('on');
      if (readyBtn) readyBtn.style.display = 'none';
    } else {
      const isMe = (data.uid === myUid);
      el.classList.add(isMe ? 'mine' : 'opponent');
      avatarEl.textContent = data.avatar || '🐱';
      nameEl.textContent = isMe ? '我' : '对手';
      if (data.ready) {
        statusEl.textContent = '✓ 已准备';
        statusEl.classList.add('on');
      } else {
        statusEl.textContent = '未准备';
        statusEl.classList.remove('on');
      }
      if (readyBtn && isMe) {
        readyBtn.style.display = 'block';
        readyBtn.textContent = data.ready ? '✓ 已准备 · 点击取消' : '点击准备';
        readyBtn.classList.toggle('ready', !!data.ready);
      } else if (readyBtn) {
        readyBtn.style.display = 'none';
      }
      // Add leave button for my own seat
      if (isMe) {
        const leaveBtn = document.createElement('button');
        leaveBtn.className = 'seat-leave';
        leaveBtn.textContent = '✕';
        leaveBtn.title = '离开座位';
        leaveBtn.onclick = (e) => { e.stopPropagation(); leaveSeat(); };
        el.appendChild(leaveBtn);
      }
    }
  }
  // Status line
  const aData = seats.A, bData = seats.B;
  const both = aData && bData;
  if (!mySeat && !both) {
    setStatus('点击空座位入坐', '');
  } else if (!mySeat && both) {
    setStatus('两个座位都有人了，等下一局吧', 'warn');
  } else if (mySeat && !both) {
    setStatus('等待对手入坐...', '');
  } else if (both && aData.ready && bData.ready) {
    setStatus('双方就绪，即将开始！', 'go');
  } else if (both && (aData.ready || bData.ready)) {
    setStatus('等待另一位玩家准备...', '');
  } else {
    setStatus('双方就坐，点击准备开始', '');
  }
}

document.addEventListener('DOMContentLoaded', () => {
  // Click on a seat: claim if empty (and I'm not seated elsewhere) or do nothing
  ['A', 'B'].forEach(s => {
    const seatEl = $('seat' + s);
    seatEl.addEventListener('click', (e) => {
      if (e.target.closest('.seat-leave')) return;
      if (e.target.closest('.ready-btn')) return; // ready handled separately
      // Avatar click on my own seat → cycle avatar
      if (mySeat === s && e.target.closest('.seat-avatar')) {
        myAvatarIdx = (myAvatarIdx + 1) % AVATARS.length;
        setMyAvatar(AVATARS[myAvatarIdx]);
        return;
      }
      // Empty seat click → claim
      if (!seats[s]) {
        if (mySeat) {
          // already in another seat, switch
          leaveSeat(false).then(() => claimSeat(s));
        } else {
          claimSeat(s);
        }
      }
    });
    const rb = $('readyBtn' + s);
    if (rb) rb.addEventListener('click', (e) => {
      e.stopPropagation();
      if (mySeat !== s) return;
      setReady(!myReady);
    });
  });

  $('leaveBtn').addEventListener('click', leaveGame);
  $('overlayBtn').addEventListener('click', (e) => { e.stopPropagation(); leaveGame(); });
  $('overlay').addEventListener('click', () => { if (phase === 'gameover') leaveGame(); });

  document.querySelectorAll('.power-btn').forEach(btn => {
    btn.addEventListener('click', () => activatePower(btn.dataset.power));
  });

  $('muteBtn').addEventListener('click', e => {
    muted = !muted;
    e.currentTarget.textContent = muted ? '🔇' : '🔊';
  });

  const soloBtnEl = $('soloBtn');
  if (soloBtnEl) soloBtnEl.addEventListener('click', startSolo);
});

// ============================================================
// FRUITS — 10 种水果（去掉了柠檬），按图片配色
// 顺序: 蓝莓 → 青柠 → 樱桃 → 橙子 → 番茄 → 奇异果 → 桃子 → 菠萝 → 哈密瓜 → 西瓜
// ============================================================
const canvas = $('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// FRUITS: 物理半径 r，配色 body/accent 作为图片未加载时的回退色，
// sx/sy/sw/sh 是 watermelon-battle.png 这张雪碧图里每个水果的像素位置（自动检测的）
// 雪碧图坐标（基于 fruits.png ~1248x1248）。如果图标位置不对，调整 sx/sy/sw/sh 即可。
// 基于 1254x1254 fruits.png 校准的坐标。如果切错位，URL 加 ?debug=1 看裁切框。
const FRUITS = [
  { name:'蓝莓',   r:14, body:'#3155b8', accent:'#1d3a8a', sx:165, sy:48,   sw:185, sh:215 },
  { name:'葡萄',   r:19, body:'#7d3eaa', accent:'#5a2982', sx:455, sy:18,   sw:340, sh:265 },
  { name:'橙子',   r:25, body:'#f39c12', accent:'#b87510', sx:855, sy:48,   sw:265, sh:240 },
  { name:'猕猴桃', r:31, body:'#94c941', accent:'#8b6f3a', sx:155, sy:325,  sw:300, sh:265 },
  { name:'苹果',   r:38, body:'#e63946', accent:'#a4262c', sx:480, sy:300,  sw:295, sh:295 },
  { name:'桃子',   r:45, body:'#ffc1b3', accent:'#e89189', sx:805, sy:318,  sw:340, sh:280 },
  { name:'菠萝',   r:53, body:'#f4d03f', accent:'#b58a07', sx:50,  sy:595,  sw:255, sh:295 },
  { name:'椰子',   r:62, body:'#fefefe', accent:'#8b6f3a', sx:320, sy:615,  sw:290, sh:260 },
  { name:'哈密瓜', r:72, body:'#a8cd6a', accent:'#7a9b3e', sx:615, sy:595,  sw:295, sh:295 },
  { name:'榴莲',   r:82, body:'#b8c93d', accent:'#7a9b1f', sx:930, sy:600,  sw:255, sh:285 },
  { name:'西瓜',   r:95, body:'#2d8659', accent:'#1d5e3c', sx:270, sy:885,  sw:370, sh:355 }
];
const CUT_MELON_SPRITE = { sx: 645, sy: 885, sw: 380, sh: 355 };
const FINAL_TYPE = FRUITS.length - 1; // 西瓜 = 10

// 加载雪碧图（同目录下的 fruits.png），加载失败自动回退到 canvas 绘制
let spriteReady = false;
let autoDetected = false;
const spriteImg = new Image();
spriteImg.crossOrigin = 'anonymous';
spriteImg.onload = () => {
  spriteReady = true;
  setTimeout(autoDetectSprites, 0);
};
spriteImg.onerror = () => { console.warn('fruits.png 加载失败，使用 canvas 绘图回退'); };
spriteImg.src = 'fruits.png';
const DEBUG_SPRITES = new URL(location.href).searchParams.get('debug') === '1';

// 自动检测诊断信息（暴露给 debug 覆盖显示）
let autoDetectInfo = '';

// 利用透明背景自动测出每个水果的精确边界（flood fill）
function autoDetectSprites() {
  if (!spriteImg.complete || !spriteImg.naturalWidth) {
    autoDetectInfo = '图片未加载完';
    return;
  }
  try {
    const W = spriteImg.naturalWidth, H = spriteImg.naturalHeight;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const cctx = c.getContext('2d');
    cctx.drawImage(spriteImg, 0, 0);
    let data;
    try {
      data = cctx.getImageData(0, 0, W, H).data;
    } catch (e) {
      autoDetectInfo = 'CORS 阻止读取像素';
      console.warn('getImageData 失败（可能 CORS）：', e);
      return;
    }

    // 自动检测背景类型：取四个角落的像素，如果都很暗或全透明 → 透明背景；
    // 如果都很亮（白）→ 白背景。
    const corner = (x, y) => {
      const i = (y * W + x) * 4;
      return { r: data[i], g: data[i+1], b: data[i+2], a: data[i+3] };
    };
    const c1 = corner(2, 2), c2 = corner(W-3, 2), c3 = corner(2, H-3), c4 = corner(W-3, H-3);
    const avgA = (c1.a + c2.a + c3.a + c4.a) / 4;
    const isWhiteBg = avgA > 200 && (c1.r + c1.g + c1.b) / 3 > 200;
    const isTransparentBg = avgA < 30;
    let isFruit;
    if (isTransparentBg) {
      isFruit = (i) => data[i * 4 + 3] >= 30;
      autoDetectInfo = '背景: 透明';
    } else if (isWhiteBg) {
      // 非白即水果（任何颜色显著偏离 255 都算）
      isFruit = (i) => {
        const r = data[i*4], g = data[i*4+1], b = data[i*4+2], a = data[i*4+3];
        if (a < 30) return false;
        return (255 - Math.min(r, g, b)) > 35;  // 至少有一个通道明显偏暗
      };
      autoDetectInfo = '背景: 白色';
    } else {
      isFruit = (i) => data[i * 4 + 3] >= 30;
      autoDetectInfo = `背景: 不明 (corner_a=${avgA.toFixed(0)})`;
    }

    const MIN_BLOB = 150;
    const visited = new Uint8Array(W * H);
    const blobs = [];

    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const idx = y * W + x;
        if (visited[idx]) continue;
        if (!isFruit(idx)) { visited[idx] = 1; continue; }
        let minX = x, maxX = x, minY = y, maxY = y, count = 0;
        const stack = [idx];
        visited[idx] = 1;
        while (stack.length) {
          const i = stack.pop();
          const px = i % W;
          const py = (i - px) / W;
          count++;
          if (px < minX) minX = px;
          if (px > maxX) maxX = px;
          if (py < minY) minY = py;
          if (py > maxY) maxY = py;
          if (px > 0)     { const n = i - 1; if (!visited[n] && isFruit(n)) { visited[n] = 1; stack.push(n); } }
          if (px < W - 1) { const n = i + 1; if (!visited[n] && isFruit(n)) { visited[n] = 1; stack.push(n); } }
          if (py > 0)     { const n = i - W; if (!visited[n] && isFruit(n)) { visited[n] = 1; stack.push(n); } }
          if (py < H - 1) { const n = i + W; if (!visited[n] && isFruit(n)) { visited[n] = 1; stack.push(n); } }
        }
        if (count < MIN_BLOB) continue;
        blobs.push({ minX, maxX, minY, maxY, count });
      }
    }
    console.log(`检测到 ${blobs.length} 个连通块 [${autoDetectInfo}]`);
    autoDetectInfo += ` · ${blobs.length}块`;

    // 多次合并：从大到小逐步放宽 proximity 阈值
    let merged = blobs.map(b => Object.assign({}, b));
    for (const PROXIMITY of [10, 18, 28, 40]) {
      if (merged.length <= 12) break;
      const next = [];
      const used = new Array(merged.length).fill(false);
      for (let i = 0; i < merged.length; i++) {
        if (used[i]) continue;
        const r = Object.assign({}, merged[i]);
        used[i] = true;
        let again = true;
        while (again) {
          again = false;
          for (let j = 0; j < merged.length; j++) {
            if (used[j]) continue;
            const b = merged[j];
            const dx = Math.max(0, Math.max(r.minX - b.maxX, b.minX - r.maxX));
            const dy = Math.max(0, Math.max(r.minY - b.maxY, b.minY - r.maxY));
            if (dx < PROXIMITY && dy < PROXIMITY) {
              r.minX = Math.min(r.minX, b.minX);
              r.maxX = Math.max(r.maxX, b.maxX);
              r.minY = Math.min(r.minY, b.minY);
              r.maxY = Math.max(r.maxY, b.maxY);
              used[j] = true;
              again = true;
            }
          }
        }
        next.push(r);
      }
      merged = next;
    }
    for (const r of merged) {
      r.cx = (r.minX + r.maxX) / 2;
      r.cy = (r.minY + r.maxY) / 2;
    }
    console.log(`合并后 ${merged.length} 个水果`);
    autoDetectInfo += `→${merged.length}水果`;

    if (merged.length < 8) {
      autoDetectInfo += ' ✗太少';
      console.warn('水果数量太少，使用手动坐标');
      return;
    }

    // 按行分组：自适应阈值
    merged.sort((a, b) => a.cy - b.cy);
    let dys = [];
    for (let i = 1; i < merged.length; i++) dys.push(merged[i].cy - merged[i-1].cy);
    dys.sort((a,b) => a - b);
    const medianDy = dys[Math.floor(dys.length / 2)] || 100;
    const rowThreshold = Math.max(60, medianDy * 1.5); // 大于 1.5 倍中位数才算换行
    const rows = [];
    let cur = [], lastY = -Infinity;
    for (const r of merged) {
      if (r.cy - lastY > rowThreshold) {
        if (cur.length) rows.push(cur);
        cur = [];
      }
      cur.push(r);
      lastY = r.cy;
    }
    if (cur.length) rows.push(cur);
    for (const row of rows) row.sort((a, b) => a.cx - b.cx);
    const ordered = [].concat(...rows);

    const margin = 4;
    for (let i = 0; i < FRUITS.length && i < ordered.length; i++) {
      const r = ordered[i];
      FRUITS[i].sx = Math.max(0, r.minX - margin);
      FRUITS[i].sy = Math.max(0, r.minY - margin);
      FRUITS[i].sw = Math.min(W - FRUITS[i].sx, (r.maxX - r.minX) + margin * 2);
      FRUITS[i].sh = Math.min(H - FRUITS[i].sy, (r.maxY - r.minY) + margin * 2);
    }
    if (ordered.length > FRUITS.length) {
      const r = ordered[FRUITS.length];
      CUT_MELON_SPRITE.sx = Math.max(0, r.minX - margin);
      CUT_MELON_SPRITE.sy = Math.max(0, r.minY - margin);
      CUT_MELON_SPRITE.sw = Math.min(W - CUT_MELON_SPRITE.sx, (r.maxX - r.minX) + margin * 2);
      CUT_MELON_SPRITE.sh = Math.min(H - CUT_MELON_SPRITE.sy, (r.maxY - r.minY) + margin * 2);
    }
    autoDetected = true;
    autoDetectInfo += ' ✓';
    console.log('自动校准成功！', FRUITS.map(f => `${f.name}: ${f.sx},${f.sy} ${f.sw}×${f.sh}`));
  } catch (e) {
    autoDetectInfo = '异常: ' + e.message;
    console.warn('自动校准失败：', e);
  }
}

const BIN_W = 300, TOP_Y = 80, FLOOR_Y = 690, DROP_Y = 42, MY_X = 20;
const RC_X = 340, RC_W = 130;
const MINI_W = 100, MINI_H = MINI_W * (FLOOR_Y - TOP_Y) / BIN_W;
const MINI_SCALE = MINI_W / BIN_W;
const MINI_X = RC_X + (RC_W - MINI_W) / 2;
const MINI_Y = 230;

function makeMe() {
  return { binX: MY_X, color: '#0984e3', fruits: [], score: 0, alive: true,
    currentType: rand5(), currentX: MY_X + BIN_W/2, nextType: rand5(),
    lastDrop: 0, readyToDrop: true, maxFruit: 0,
    shakeAmt: 0, shakeMaxAmt: 0, shakeImmune: 0, explodeT: 0,
    comboQueue: [], powers: { shake: 2, combo: 1 } };
}
function makeOpp() { return { fruits: [], score: 0, alive: true, maxFruit: 0 }; }
function rand5() { return Math.floor(Math.random() * 5); }

let me, opp;
let particles = [];
let frame = 0;
let victoryAnim = 0; // 0..1, animation progress when winning
let victoryParticles = [];

function resetGame() {
  me = makeMe(); opp = makeOpp(); particles = [];
  myTouchId = null; $('overlay').classList.remove('show');
  gameEndTime = 0;
  winDeclared = false;
  updateTimerDisplay(GAME_DURATION_MS);
  updatePowerButtons();
}

let muted = true; let actx = null;
function beep(f, d, t, v) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type = t || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(v || 0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + (d || 0.06));
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + (d || 0.06));
  } catch (e) {}
}

const keys = {};
window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowDown','Space','KeyA','KeyD','KeyS'].includes(e.code)) e.preventDefault();
  if (!keys[e.code] && phase === 'playing') {
    if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'KeyS') tryDrop();
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let myTouchId = null;
function touchPos(t) {
  const r = canvas.getBoundingClientRect();
  return { x: (t.clientX - r.left) * canvas.width / r.width, y: (t.clientY - r.top) * canvas.height / r.height };
}
function moveTo(x) {
  const fr = FRUITS[me.currentType].r;
  me.currentX = clamp(x, MY_X + fr + 4, MY_X + BIN_W - fr - 4);
}
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (phase !== 'playing' || !me.alive) return;
  for (const t of e.changedTouches) {
    const { x } = touchPos(t);
    if (x > MY_X + BIN_W) continue;
    if (myTouchId === null) { myTouchId = t.identifier; moveTo(x); }
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (phase !== 'playing' || !me.alive) return;
  for (const t of e.changedTouches) {
    if (myTouchId === t.identifier) moveTo(touchPos(t).x);
  }
}, { passive: false });
function endTouch(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (myTouchId === t.identifier) {
      if (phase === 'gameover') { leaveGame(); }
      else if (phase === 'playing') tryDrop();
      myTouchId = null;
    }
  }
  // 在 gameover 阶段任何触摸结束都回大厅
  if (phase === 'gameover' && e.changedTouches.length > 0) {
    leaveGame();
  }
}
canvas.addEventListener('touchend', endTouch, { passive: false });
canvas.addEventListener('touchcancel', endTouch, { passive: false });

let mDown = false;
canvas.addEventListener('mousedown', e => {
  if (phase !== 'playing' || !me.alive) return;
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * canvas.width / r.width;
  if (x > MY_X + BIN_W) return;
  mDown = true; moveTo(x);
});
canvas.addEventListener('mousemove', e => {
  if (!mDown) return;
  const r = canvas.getBoundingClientRect();
  moveTo((e.clientX - r.left) * canvas.width / r.width);
});
canvas.addEventListener('mouseup', (e) => {
  if (phase === 'gameover') { leaveGame(); mDown = false; return; }
  if (mDown && phase === 'playing') tryDrop();
  mDown = false;
});
canvas.addEventListener('mouseleave', () => { mDown = false; });

// ============================================================
// POWERS（道具）
// ============================================================
function activatePower(power) {
  if (phase !== 'playing' || !me.alive) return;
  if (me.powers[power] <= 0) return;
  if (power === 'shake') {
    me.powers.shake--;
    // 强横向 + 对称纵向扰动（无下压偏置），靠 shakeImmune 保护安全
    for (const f of me.fruits) {
      f.vx += (Math.random() - 0.5) * 30;
      f.vy += (Math.random() - 0.5) * 6;
    }
    me.shakeAmt = 36;
    me.shakeMaxAmt = 36;
    me.shakeImmune = 90;  // 1.5 秒红线判定免疫
    beep(150, 0.25, 'sawtooth', 0.04);
  } else if (power === 'combo') {
    me.powers.combo--;
    // 给 5 个苹果（type 4）
    const t = 4;
    me.currentType = t;
    const fr = FRUITS[t].r;
    me.currentX = clamp(me.currentX, MY_X + fr + 4, MY_X + BIN_W - fr - 4);
    me.nextType = t;
    me.comboQueue = [t, t, t];
    beep(440, 0.08, 'sine', 0.05);
    beep(550, 0.08, 'sine', 0.05);
    beep(660, 0.12, 'sine', 0.05);
  }
  updatePowerButtons();
}

function updatePowerButtons() {
  if (!me) return;
  for (const pw of ['shake', 'combo']) {
    const cEl = $(`${pw}-count`);
    if (cEl) cEl.textContent = me.powers[pw];
    const btn = document.querySelector(`.power-btn[data-power="${pw}"]`);
    if (btn) btn.disabled = (me.powers[pw] <= 0) || !me.alive || phase !== 'playing';
  }
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function tryDrop() {
  if (!me.alive || phase !== 'playing') return;
  if (!me.readyToDrop) return;
  const t = performance.now();
  if (t - me.lastDrop < 380) return;
  me.lastDrop = t;
  me.readyToDrop = false;
  me.fruits.push({ x: me.currentX, y: DROP_Y, vx: 0, vy: 0, type: me.currentType,
    hasEnteredBin: false, age: 0, mergeFlash: 0, blink: 0,
    prevVY: 0, squash: 0, rot: (Math.random() - 0.5) * 0.06,
    breath: Math.random() * Math.PI * 2, mergeScale: 0 });
  if (me.comboQueue.length > 0) {
    me.currentType = me.nextType;
    me.nextType = me.comboQueue.shift();
  } else {
    me.currentType = me.nextType;
    me.nextType = rand5();
  }
  const fr = FRUITS[me.currentType].r;
  me.currentX = clamp(me.currentX, MY_X + fr + 4, MY_X + BIN_W - fr - 4);
  setTimeout(() => { me.readyToDrop = true; }, 280);
  beep(180 + Math.random() * 50, 0.04, 'sine', 0.04);
}

const GRAVITY = 0.45, DAMP = 0.995, REST = 0.22, ITERS = 8, MAX_V = 22;

function step() {
  const fruits = me.fruits;
  for (const f of fruits) {
    f.vy += GRAVITY; f.vx *= DAMP; f.vy *= DAMP;
    const v = Math.hypot(f.vx, f.vy);
    if (v > MAX_V) { f.vx = f.vx/v * MAX_V; f.vy = f.vy/v * MAX_V; }
    f.x += f.vx; f.y += f.vy; f.age++;
    if (f.mergeFlash > 0) f.mergeFlash--;
    if (f.blink > 0) f.blink--;

    // ========== 动画状态更新 ==========
    // 落地/碰撞挤压：上一帧明显在下落、这一帧速度骤降 => 触发 squash
    const prevVY = f.prevVY || 0;
    if (f.hasEnteredBin && prevVY > 4 && Math.abs(f.vy) < 1.6 && (f.squash || 0) < 0.3) {
      f.squash = Math.min(1, prevVY / 10);
    }
    f.prevVY = f.vy;
    if (f.squash > 0) f.squash = Math.max(0, f.squash - 0.085);
    // 摆动（最多 ±15°，永不翻面）
    const targetRot = clamp(f.vx * 0.04, -0.26, 0.26);
    f.rot = (f.rot || 0) + (targetRot - (f.rot || 0)) * 0.12;
    // 呼吸 phase（每个水果初始相位随机，看起来不同步）
    f.breath = (f.breath || 0) + 0.045;
    // 合成弹跳衰减
    if (f.mergeScale > 0) f.mergeScale = Math.max(0, f.mergeScale - 0.06);
  }
  for (let it = 0; it < ITERS; it++) {
    for (const f of fruits) {
      const fr = FRUITS[f.type].r;
      if (f.x - fr < MY_X) { f.x = MY_X + fr; if (f.vx < 0) f.vx = -f.vx * REST; }
      if (f.x + fr > MY_X + BIN_W) { f.x = MY_X + BIN_W - fr; if (f.vx > 0) f.vx = -f.vx * REST; }
      if (f.y + fr > FLOOR_Y) { f.y = FLOOR_Y - fr; if (f.vy > 0) f.vy = -f.vy * REST; f.vx *= 0.9; }
    }
    for (let i = 0; i < fruits.length; i++) {
      for (let j = i + 1; j < fruits.length; j++) {
        const a = fruits[i], b = fruits[j];
        const ra = FRUITS[a.type].r, rb = FRUITS[b.type].r;
        const dx = b.x - a.x, dy = b.y - a.y;
        let dist = Math.hypot(dx, dy);
        const minD = ra + rb;
        if (dist < minD) {
          if (dist < 0.001) { b.x += 0.5; b.y -= 0.5; dist = 0.5; }
          const nx = dx/dist, ny = dy/dist, overlap = minD - dist;
          const ma = ra*ra, mb = rb*rb, total = ma + mb;
          a.x -= nx * overlap * (mb/total); a.y -= ny * overlap * (mb/total);
          b.x += nx * overlap * (ma/total); b.y += ny * overlap * (ma/total);
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn < 0) {
            const jj = -(1 + REST) * vn / (1/ma + 1/mb);
            const ix = jj * nx, iy = jj * ny;
            a.vx -= ix/ma; a.vy -= iy/ma;
            b.vx += ix/mb; b.vy += iy/mb;
          }
        }
      }
    }
  }
  for (const f of fruits) {
    const fr = FRUITS[f.type].r;
    if (!f.hasEnteredBin && f.y - fr > TOP_Y + 4) f.hasEnteredBin = true;
    if (f.type > me.maxFruit) me.maxFruit = f.type;
  }

  const consumed = new Set(); const newOnes = [];
  for (let i = 0; i < fruits.length; i++) {
    if (consumed.has(i)) continue;
    const a = fruits[i];
    if (a.type >= FRUITS.length - 1) continue;
    for (let j = i + 1; j < fruits.length; j++) {
      if (consumed.has(j)) continue;
      const b = fruits[j];
      if (a.type !== b.type) continue;
      const ra = FRUITS[a.type].r, rb = FRUITS[b.type].r;
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist < ra + rb + 1.5) {
        consumed.add(i); consumed.add(j);
        const newType = a.type + 1;
        const merged = { x: (a.x+b.x)/2, y: (a.y+b.y)/2, vx: (a.vx+b.vx)/2, vy: (a.vy+b.vy)/2,
          type: newType, hasEnteredBin: true, age: 0, mergeFlash: 18, blink: 12,
          prevVY: 0, squash: 0, rot: 0,
          breath: Math.random() * Math.PI * 2, mergeScale: 0.7 };
        newOnes.push(merged);
        me.score += (newType + 1) * 10;
        spawnParticles(merged.x, merged.y, FRUITS[newType].body, 8 + newType);
        beep(440 + newType * 50, 0.08, 'triangle', 0.05);
        if (newType === FINAL_TYPE) {
          // 合成大西瓜：胜利！全屏粒子爆炸 + 触发 onMyWin
          beep(660, 0.2, 'sine', 0.07);
          setTimeout(() => beep(880, 0.25, 'sine', 0.08), 100);
          setTimeout(() => beep(1100, 0.3, 'sine', 0.08), 220);
          spawnParticles(merged.x, merged.y, '#2ecc71', 50);
          spawnParticles(merged.x, merged.y, '#fdcb6e', 40);
          spawnParticles(merged.x, merged.y, '#ff6b6b', 30);
          onMyWin();
        }
        break;
      }
    }
  }
  if (consumed.size > 0) me.fruits = fruits.filter((_, i) => !consumed.has(i)).concat(newOnes);

  // 失败判定：水果中心线越过封顶线即出局（摇晃免疫期内不判死）
  if (me.shakeImmune > 0) {
    me.shakeImmune--;
  } else {
    let centerOver = false;
    for (const f of me.fruits) {
      const speed = Math.hypot(f.vx, f.vy);
      if (f.hasEnteredBin && f.y <= TOP_Y && f.age > 30 && speed < 2.5) {
        centerOver = true; break;
      }
    }
    if (centerOver) onMyDeath();
  }

  // 摇晃期间持续给水果小冲击（搭配开头的大冲击形成"震荡"）
  if (me.shakeAmt > 0) {
    const intensity = me.shakeAmt / (me.shakeMaxAmt || 1);
    for (const f of me.fruits) {
      f.vx += (Math.random() - 0.5) * 4 * intensity;
      f.vy += (Math.random() - 0.5) * 2 * intensity;
    }
    me.shakeAmt--;
  }
}

function onMyDeath() {
  if (!me.alive) return;
  me.alive = false; me.explodeT = 90;
  for (const f of me.fruits) spawnParticles(f.x, f.y, FRUITS[f.type].body, 12);
  spawnParticles(MY_X + BIN_W / 2, TOP_Y + 60, '#e74c3c', 50);
  me.fruits = []; me.shakeAmt = 30;
  beep(150, 0.5, 'sawtooth', 0.08);
  if (isSolo) {
    setTimeout(() => showResult('单人出局', 'soloDeath'), 1400);
    return;
  }
  send({ t: 'lost', score: me.score });
  setTimeout(() => {
    if (!opp.alive) {
      const r = me.score > opp.score ? '平局（你分高）' : me.score < opp.score ? '你输了' : '平局';
      showResult(r);
    } else { showResult('你输了'); }
  }, 1400);
}

function onOppLost(s) {
  if (!opp.alive) return;
  opp.alive = false; opp.score = s;
  if (!me.alive) {
    setTimeout(() => {
      const r = me.score > opp.score ? '你赢了' : me.score < opp.score ? '你输了' : '平局';
      showResult(r);
    }, 200);
  } else { setTimeout(() => showResult('你赢了'), 800); }
}

// 一旦哪一边宣告"合成西瓜胜"，winDeclared 锁住，避免双方同时合成或后续消息推翻结果
let winDeclared = false;

function onMyWin() {
  if (phase !== 'playing' || winDeclared) return;
  winDeclared = true;
  if (isSolo) {
    setTimeout(() => showResult('合成大西瓜', 'watermelon'), 1100);
    return;
  }
  send({ t: 'won', score: me.score, reason: 'watermelon' });
  setTimeout(() => showResult('你赢了', 'watermelon'), 1100);
}

function onOppWon(s) {
  if (phase === 'gameover' || winDeclared) return;
  winDeclared = true;
  opp.score = s;
  setTimeout(() => showResult('你输了', 'oppWatermelon'), 200);
}

function onTimeUp() {
  // 时间到
  if (phase !== 'playing') return;
  if (isSolo) {
    showResult('单局结束', 'soloTime');
    return;
  }
  let r;
  if (me.score > opp.score) r = '你赢了';
  else if (me.score < opp.score) r = '你输了';
  else r = '平局';
  showResult(r);
}

function startVictoryAnim() {
  victoryAnim = 0.001;
  victoryParticles = [];
  // 撒花粒子
  for (let i = 0; i < 60; i++) {
    const colors = ['#fdcb6e', '#e74c3c', '#00b894', '#0984e3', '#a29bfe', '#ff7f7f'];
    victoryParticles.push({
      x: 240, y: 360,
      vx: (Math.random() - 0.5) * 14,
      vy: -8 - Math.random() * 8,
      gravity: 0.25 + Math.random() * 0.15,
      color: colors[Math.floor(Math.random() * colors.length)],
      r: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 0.3,
      life: 200,
      max: 200
    });
  }
  // 三连胜利音
  beep(660, 0.15, 'triangle', 0.07);
  setTimeout(() => beep(880, 0.15, 'triangle', 0.07), 150);
  setTimeout(() => beep(1100, 0.25, 'triangle', 0.07), 300);
}

function showResult(txt, reason) {
  if (phase === 'gameover') return;
  phase = 'gameover';
  // 触发胜利动画（合成西瓜或赢了对手）
  const isWin = (reason === 'watermelon' || txt === '你赢了' || txt.indexOf('赢') >= 0);
  if (isWin) startVictoryAnim();
  const overlay = $('overlay'); const rt = $('resultText');
  const title = $('overlayTitle'); const msg = $('overlayMsg');
  let subtitle = '';

  if (isSolo) {
    const isNewHigh = me.score > soloHighScore;
    if (isNewHigh) {
      try { localStorage.setItem('wmbSoloHigh', String(me.score)); } catch (e) {}
      soloHighScore = me.score;
    }
    if (reason === 'watermelon') {
      rt.textContent = '🍉 合成大西瓜！'; rt.className = 'result win'; title.textContent = '完美通关';
      subtitle = '完成最终合成！';
    } else if (reason === 'soloDeath') {
      rt.textContent = '💥 出局'; rt.className = 'result lose'; title.textContent = '游戏结束';
      subtitle = '水果溢出啦';
    } else {
      rt.textContent = '⏱ 时间到'; rt.className = 'result tie'; title.textContent = '单局结束';
    }
    msg.innerHTML = `${subtitle ? `<b style="color:#fdcb6e">${subtitle}</b><br>` : ''}本局分数: <b style="font-size:18px;">${me.score}</b><br>${isNewHigh ? '<b style="color:#fdcb6e">🎉 新纪录！</b><br>' : ''}历史最高: <b>${soloHighScore}</b>`;
    overlay.classList.add('show');
    updatePowerButtons();
    return;
  }

  if (txt === '你赢了') {
    if (reason === 'watermelon') {
      rt.textContent = '🍉 合成大西瓜！'; subtitle = '你赢了';
    } else {
      rt.textContent = '🏆 你赢了!';
    }
    rt.className = 'result win'; title.textContent = '胜利';
  } else if (txt === '你输了') {
    rt.textContent = '😢 你输了';
    if (reason === 'oppWatermelon') subtitle = '对手合成了大西瓜';
    rt.className = 'result lose'; title.textContent = '失败';
  } else if (txt.includes('平局')) {
    rt.textContent = '🤝 平局'; rt.className = 'result tie'; title.textContent = '平局';
  } else {
    rt.textContent = '游戏结束'; rt.className = 'result tie'; title.textContent = txt;
  }
  msg.innerHTML = `${subtitle ? `<b style="color:#fdcb6e">${subtitle}</b><br>` : ''}你的分数: <b>${me.score}</b><br>对手分数: <b>${opp.score}</b>`;
  overlay.classList.add('show');
  updatePowerButtons();
}

function spawnParticles(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2; const s = 2 + Math.random() * 5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, color: c, life: 40, max: 40, r: 2 + Math.random() * 3 });
  }
}
function stepParticles() {
  for (const p of particles) { p.vy += 0.2; p.x += p.vx; p.y += p.vy; p.vx *= 0.97; p.life--; }
  particles = particles.filter(p => p.life > 0);
}

function maybeSendState() {
  if (isSolo) return;
  const now = performance.now();
  if (now - lastSyncSent < 100) return;
  lastSyncSent = now;
  send({ t: 'state', f: me.fruits.map(f => [Math.round(f.x), Math.round(f.y), f.type]),
    s: me.score, a: me.alive ? 1 : 0, m: me.maxFruit });
}

function updateTimerDisplay(remainMs) {
  const el = $('timerDisplay');
  if (!el) return;
  const r = Math.max(0, Math.ceil(remainMs / 1000));
  const m = Math.floor(r / 60);
  const s = r % 60;
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  if (r <= 10) el.classList.add('warn'); else el.classList.remove('warn');
}

function update() {
  frame++;
  // 推进胜利动画
  if (victoryAnim > 0 && victoryAnim < 1) {
    victoryAnim = Math.min(1, victoryAnim + 0.012);
  }
  for (const p of victoryParticles) {
    p.x += p.vx; p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.rot += p.vrot;
    p.life--;
  }
  victoryParticles = victoryParticles.filter(p => p.life > 0);
  if (phase === 'countdown') { stepParticles(); if (performance.now() >= countdownEnd) startPlaying(); return; }
  if (phase === 'gameover') { stepParticles(); return; }
  if (phase !== 'playing') return;
  // 倒计时检查
  const remain = gameEndTime - performance.now();
  updateTimerDisplay(remain);
  if (remain <= 0) { onTimeUp(); return; }
  if (keys['ArrowLeft'] || keys['KeyA']) moveTo(me.currentX - 5);
  if (keys['ArrowRight'] || keys['KeyD']) moveTo(me.currentX + 5);
  if (me.alive) step();
  else if (me.explodeT > 0) me.explodeT--;
  stepParticles();
  maybeSendState();
}

// ============================================================
// DRAWING
// ============================================================
// 用雪碧图绘制带动画的水果。opts 支持：
//   alpha, flash, radius, squash (0-1 落地挤压), rot (旋转弧度),
//   breath (呼吸 phase), mergeScale (0-1 合成弹跳)
function drawCuteFruit(x, y, type, opts) {
  opts = opts || {};
  const f = FRUITS[type];
  const r = (opts.radius != null) ? opts.radius : f.r;
  const flash = opts.flash || 0;
  const squash = opts.squash || 0;
  const breath = opts.breath || 0;
  const rot = opts.rot || 0;
  const mergeScale = opts.mergeScale || 0;
  const blink = opts.blink || 0;
  const alpha = opts.alpha != null ? opts.alpha : 1;

  ctx.save();
  ctx.globalAlpha = alpha;

  // 合成时金色发光
  if (flash > 0) {
    const a = Math.min(0.85, flash / 18 * 0.75);
    ctx.fillStyle = `rgba(255,240,160,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r + 11 + (18 - flash) * 0.4, 0, Math.PI * 2); ctx.fill();
  }

  ctx.translate(x, y);
  ctx.rotate(rot);

  // 落地挤压
  let sxScale = 1, syScale = 1;
  if (squash > 0) { sxScale = 1 + squash * 0.15; syScale = 1 - squash * 0.25; }
  // 合成弹跳
  if (mergeScale > 0) {
    const s = 1 + Math.sin(mergeScale * Math.PI) * 0.2;
    sxScale *= s; syScale *= s;
  }
  // 呼吸
  if (breath) {
    const s = 1 + Math.sin(breath) * 0.04;
    sxScale *= s; syScale *= s;
  }
  ctx.scale(sxScale, syScale);

  if (spriteReady) {
    // 用图片
    const dw = r * 2.16;
    const dh = dw * (f.sh / f.sw);
    const dy = -dh / 2 + dh * 0.04; // 视觉中心略微下移以露出顶部 stem
    ctx.drawImage(spriteImg, f.sx, f.sy, f.sw, f.sh, -dw / 2, dy, dw, dh);
  } else {
    // 回退：canvas 绘制 + 表情
    drawFruitBody(r, type, f);
    drawFace(r, blink);
  }

  ctx.restore();
}

// ================== 各水果具体画法 ==================
function drawFruitBody(r, type, f) {
  switch (type) {
    case 0: drawBlueberry(r); break;
    case 1: drawGrape(r); break;
    case 2: drawOrange(r); break;
    case 3: drawKiwi(r); break;
    case 4: drawApple(r); break;
    case 5: drawPeach(r); break;
    case 6: drawPineapple(r); break;
    case 7: drawCoconut(r); break;
    case 8: drawCantaloupe(r); break;
    case 9: drawDurian(r); break;
    case 10: drawWatermelon(r); break;
  }
}

function drawCircleBody(r, color, dark) {
  // 渐变球体
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
  grad.addColorStop(0, lighten(color, 30));
  grad.addColorStop(0.6, color);
  grad.addColorStop(1, dark || darken(color, 20));
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.32, -r * 0.4, r * 0.28, r * 0.16, -0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(-r * 0.45, -r * 0.55, r * 0.1, 0, Math.PI * 2); ctx.fill();
}

function lighten(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let R = (n >> 16) + amt, G = ((n >> 8) & 0xff) + amt, B = (n & 0xff) + amt;
  R = Math.min(255, R); G = Math.min(255, G); B = Math.min(255, B);
  return `rgb(${R},${G},${B})`;
}
function darken(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let R = Math.max(0, (n >> 16) - amt);
  let G = Math.max(0, ((n >> 8) & 0xff) - amt);
  let B = Math.max(0, (n & 0xff) - amt);
  return `rgb(${R},${G},${B})`;
}

function drawBlueberry(r) {
  drawCircleBody(r, '#3155b8', '#1d3a8a');
  // 小花型蒂
  ctx.fillStyle = '#5577d4';
  for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2 - Math.PI / 2;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * r * 0.18, -r * 0.85 + Math.sin(a) * r * 0.1, r * 0.12, r * 0.07, a, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#1d3a8a';
  ctx.beginPath(); ctx.arc(0, -r * 0.85, r * 0.1, 0, Math.PI * 2); ctx.fill();
}

function drawGrape(r) {
  // 整体紫圆
  drawCircleBody(r, '#7d3eaa', '#5a2982');
  // 颗粒感
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  const bumps = [[-0.4,-0.1,0.22],[0.4,-0.1,0.22],[-0.2,0.3,0.22],[0.2,0.3,0.22],[0,-0.4,0.18]];
  for (const [dx,dy,s] of bumps) {
    ctx.beginPath(); ctx.arc(dx*r, dy*r, r*s, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  for (const [dx,dy,s] of bumps) {
    ctx.beginPath(); ctx.arc(dx*r + r*0.06, dy*r + r*0.06, r*s*0.3, 0, Math.PI*2); ctx.fill();
  }
  // 小绿叶
  ctx.fillStyle = '#27ae60';
  ctx.beginPath();
  ctx.ellipse(r*0.18, -r*0.92, r*0.22, r*0.1, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(0, -r*0.95); ctx.lineTo(0, -r*1.05); ctx.stroke();
}

function drawOrange(r) {
  drawCircleBody(r, '#f39c12', '#b87510');
  // 表皮纹理
  ctx.fillStyle = 'rgba(180,90,0,0.18)';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r * 0.55, Math.sin(a) * r * 0.55, r * 0.05, 0, Math.PI * 2);
    ctx.fill();
  }
  // 顶部蒂 + 叶
  ctx.fillStyle = '#27ae60';
  ctx.beginPath();
  ctx.ellipse(r*0.15, -r*0.95, r*0.25, r*0.1, -0.4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1e8449';
  ctx.beginPath(); ctx.arc(0, -r*0.92, r*0.08, 0, Math.PI*2); ctx.fill();
}

function drawKiwi(r) {
  // 棕色边缘
  ctx.fillStyle = '#8b6f3a';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
  // 纤维边
  ctx.strokeStyle = '#6b5226';
  ctx.lineWidth = 1;
  for (let i = 0; i < 16; i++) {
    const a = i / 16 * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.86, Math.sin(a) * r * 0.86);
    ctx.lineTo(Math.cos(a) * r * 1.0, Math.sin(a) * r * 1.0);
    ctx.stroke();
  }
  // 绿色果肉
  const grad = ctx.createRadialGradient(0, 0, r*0.1, 0, 0, r * 0.85);
  grad.addColorStop(0, '#d4f08a');
  grad.addColorStop(0.7, '#94c941');
  grad.addColorStop(1, '#7a9b3e');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2); ctx.fill();
  // 中心白色
  ctx.fillStyle = '#fff8d4';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.fill();
  // 黑色种子环
  ctx.fillStyle = '#1a1a1a';
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2;
    ctx.beginPath();
    ctx.ellipse(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45, r * 0.04, r * 0.06, a, 0, Math.PI * 2);
    ctx.fill();
  }
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(-r*0.3, -r*0.4, r*0.22, r*0.13, -0.4, 0, Math.PI*2); ctx.fill();
}

function drawApple(r) {
  drawCircleBody(r, '#e63946', '#a4262c');
  // 茎
  ctx.strokeStyle = '#6b4423';
  ctx.lineWidth = Math.max(2.5, r * 0.07);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95);
  ctx.quadraticCurveTo(r * 0.08, -r * 1.1, r * 0.03, -r * 1.18);
  ctx.stroke();
  // 叶
  ctx.fillStyle = '#2ecc71';
  ctx.beginPath();
  ctx.ellipse(r * 0.25, -r * 1.05, r * 0.25, r * 0.12, -0.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1e8449'; ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(r * 0.05, -r * 1.0);
  ctx.lineTo(r * 0.45, -r * 1.08);
  ctx.stroke();
}

function drawPeach(r) {
  // 渐变粉桃
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
  grad.addColorStop(0, '#fff4f0');
  grad.addColorStop(0.5, '#ffc1b3');
  grad.addColorStop(1, '#e89189');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // 中心裂痕
  ctx.strokeStyle = 'rgba(180,90,90,0.4)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.85);
  ctx.bezierCurveTo(-r * 0.08, -r * 0.4, r * 0.05, r * 0.3, 0, r * 0.7);
  ctx.stroke();
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.32, -r * 0.4, r * 0.28, r * 0.16, -0.4, 0, Math.PI * 2); ctx.fill();
  // 茎+叶
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.95); ctx.lineTo(r * 0.05, -r * 1.08); ctx.stroke();
  ctx.fillStyle = '#2ecc71';
  ctx.beginPath();
  ctx.ellipse(r * 0.22, -r * 1.0, r * 0.22, r * 0.1, -0.4, 0, Math.PI * 2); ctx.fill();
}

function drawPineapple(r) {
  // 黄色椭圆身
  const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.1, 0, 0, r);
  grad.addColorStop(0, '#fff5a0');
  grad.addColorStop(0.6, '#f4d03f');
  grad.addColorStop(1, '#b58a07');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // 菱形纹
  ctx.strokeStyle = 'rgba(120,80,0,0.5)'; ctx.lineWidth = 1.2;
  for (let yy = -r * 0.65; yy <= r * 0.65; yy += r * 0.22) {
    for (let xx = -r * 0.65; xx <= r * 0.65; xx += r * 0.22) {
      if (Math.hypot(xx, yy) < r * 0.85) {
        ctx.beginPath();
        ctx.moveTo(xx - r * 0.11, yy);
        ctx.lineTo(xx, yy - r * 0.11);
        ctx.lineTo(xx + r * 0.11, yy);
        ctx.lineTo(xx, yy + r * 0.11);
        ctx.closePath(); ctx.stroke();
      }
    }
  }
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.3, -r * 0.4, r * 0.25, r * 0.14, -0.4, 0, Math.PI * 2); ctx.fill();
  // 顶部叶冠
  ctx.fillStyle = '#27ae60';
  const leaves = [[0, 0.85, 0.18], [-0.3, 0.65, 0.16], [0.3, 0.65, 0.16], [-0.12, 0.55, 0.13], [0.12, 0.55, 0.13]];
  for (const [dx, h, w] of leaves) {
    ctx.save();
    ctx.translate(dx * r, -r * 0.85);
    ctx.beginPath();
    ctx.moveTo(-r * w, 0);
    ctx.lineTo(0, -r * h);
    ctx.lineTo(r * w, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#1e8449';
    ctx.beginPath();
    ctx.moveTo(-r * w * 0.4, 0);
    ctx.lineTo(0, -r * h * 0.85);
    ctx.lineTo(r * w * 0.4, 0);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#27ae60';
    ctx.restore();
  }
}

function drawCoconut(r) {
  // 棕色外壳（下半部）
  ctx.fillStyle = '#8b6f3a';
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();
  // 椰肉（白色内部）
  const grad = ctx.createRadialGradient(-r * 0.2, -r * 0.3, r * 0.1, 0, 0, r * 0.85);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(0.7, '#f5e6d0');
  grad.addColorStop(1, '#e0c8a0');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, -r * 0.05, r * 0.78, 0, Math.PI * 2);
  ctx.fill();
  // 棕色边缘锯齿
  ctx.strokeStyle = '#6b5226'; ctx.lineWidth = 1.5;
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * r * 0.78, -r * 0.05 + Math.sin(a) * r * 0.78);
    ctx.lineTo(Math.cos(a) * r * 0.85, -r * 0.05 + Math.sin(a) * r * 0.85);
    ctx.stroke();
  }
  // 三个椰孔点
  ctx.fillStyle = '#5a4520';
  ctx.beginPath(); ctx.arc(-r * 0.15, -r * 0.6, r * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.15, -r * 0.6, r * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -r * 0.45, r * 0.04, 0, Math.PI * 2); ctx.fill();
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.3, -r * 0.4, r * 0.2, r * 0.1, -0.4, 0, Math.PI * 2); ctx.fill();
}

function drawCantaloupe(r) {
  drawCircleBody(r, '#a8cd6a', '#7a9b3e');
  // 网纹
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.2;
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    const yy = i * r * 0.28;
    if (Math.abs(yy) < r) {
      const xExtent = Math.sqrt(r * r - yy * yy) * 0.95;
      ctx.moveTo(-xExtent, yy); ctx.lineTo(xExtent, yy);
      ctx.stroke();
    }
  }
  for (let i = -3; i <= 3; i++) {
    ctx.beginPath();
    const xx = i * r * 0.28;
    if (Math.abs(xx) < r) {
      const yExtent = Math.sqrt(r * r - xx * xx) * 0.95;
      ctx.moveTo(xx, -yExtent); ctx.lineTo(xx, yExtent);
      ctx.stroke();
    }
  }
  // 茎
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.quadraticCurveTo(r * 0.08, -r * 1.12, r * 0.04, -r * 1.18);
  ctx.stroke();
}

function drawDurian(r) {
  // 主体颜色
  drawCircleBody(r, '#b8c93d', '#7a9b1f');
  // 刺
  ctx.fillStyle = '#a3b62f';
  ctx.strokeStyle = '#6b8015'; ctx.lineWidth = 1;
  const spikes = 28;
  for (let i = 0; i < spikes; i++) {
    const a = i / spikes * Math.PI * 2;
    const inner = r * 0.85;
    const outer = r * 1.06;
    const cx = Math.cos(a), cy = Math.sin(a);
    ctx.save();
    ctx.translate(cx * inner, cy * inner);
    ctx.rotate(a);
    ctx.beginPath();
    ctx.moveTo(0, -r * 0.07);
    ctx.lineTo(outer - inner + r * 0.08, 0);
    ctx.lineTo(0, r * 0.07);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  // 茎
  ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.0); ctx.lineTo(r * 0.04, -r * 1.18);
  ctx.stroke();
}

function drawWatermelon(r) {
  drawCircleBody(r, '#2d8659', '#1d5e3c');
  // 深绿条纹
  ctx.strokeStyle = '#0d4a2e'; ctx.lineWidth = r * 0.09; ctx.lineCap = 'round';
  for (let i = -2; i <= 2; i++) {
    const cx = i * r * 0.3;
    ctx.beginPath();
    ctx.moveTo(cx + Math.sin(i * 0.5) * r * 0.1, -r * 0.92);
    ctx.quadraticCurveTo(cx, 0, cx + Math.sin(i * 0.5) * r * 0.1, r * 0.92);
    ctx.stroke();
  }
  // 茎
  ctx.strokeStyle = '#1e5631'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(0, -r); ctx.lineTo(r * 0.06, -r * 1.12);
  ctx.stroke();
}

// ==========================================================
// 切开西瓜（胜利图）
// ==========================================================
function drawCutWatermelon(cx, cy, r) {
  if (spriteReady) {
    const dw = r * 2.1;
    const dh = dw * (CUT_MELON_SPRITE.sh / CUT_MELON_SPRITE.sw);
    ctx.drawImage(spriteImg, CUT_MELON_SPRITE.sx, CUT_MELON_SPRITE.sy, CUT_MELON_SPRITE.sw, CUT_MELON_SPRITE.sh, cx - dw/2, cy - dh/2, dw, dh);
    return;
  }
  ctx.save();
  ctx.translate(cx, cy);
  // 外绿
  ctx.fillStyle = '#2d8659';
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  // 浅绿圈
  ctx.fillStyle = '#a8d088';
  ctx.beginPath(); ctx.arc(0, 0, r * 0.92, 0, Math.PI * 2); ctx.fill();
  // 红色果肉
  const grad = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 0.85);
  grad.addColorStop(0, '#ff8a6b');
  grad.addColorStop(0.6, '#e74c3c');
  grad.addColorStop(1, '#c0392b');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2); ctx.fill();
  // 黑色种子
  ctx.fillStyle = '#1a1a1a';
  const seeds = [
    [-0.4,-0.2],[0.4,-0.2],[-0.2,0.1],[0.2,0.1],[0,0.4],[-0.5,0.3],[0.5,0.3],
    [-0.3,-0.5],[0.3,-0.5],[-0.6,0],[0.6,0],[0,-0.3],[-0.15,0.55],[0.15,0.55]
  ];
  for (const [dx, dy] of seeds) {
    ctx.beginPath();
    ctx.ellipse(dx * r, dy * r, r * 0.04, r * 0.07, dx * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // 高光
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-r * 0.3, -r * 0.4, r * 0.3, r * 0.18, -0.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ================== 表情 ==================
function drawFace(r, blink) {
  const eyeY = r * 0.05;
  const eyeOff = r * 0.32;
  const eyeR = Math.max(2.2, r * 0.13);
  if (blink > 6) {
    ctx.strokeStyle = '#2c2c2c'; ctx.lineWidth = Math.max(1.5, r * 0.08); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(-eyeOff, eyeY, eyeR, Math.PI + 0.3, 2 * Math.PI - 0.3); ctx.stroke();
    ctx.beginPath(); ctx.arc(eyeOff, eyeY, eyeR, Math.PI + 0.3, 2 * Math.PI - 0.3); ctx.stroke();
  } else {
    ctx.fillStyle = '#2c2c2c';
    ctx.beginPath();
    ctx.arc(-eyeOff, eyeY, eyeR, 0, Math.PI * 2);
    ctx.arc(eyeOff, eyeY, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(-eyeOff + eyeR * 0.35, eyeY - eyeR * 0.35, eyeR * 0.4, 0, Math.PI * 2);
    ctx.arc(eyeOff + eyeR * 0.35, eyeY - eyeR * 0.35, eyeR * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // 腮红
  ctx.fillStyle = 'rgba(255,110,130,0.55)';
  ctx.beginPath();
  ctx.arc(-r * 0.55, r * 0.22, r * 0.13, 0, Math.PI * 2);
  ctx.arc(r * 0.55, r * 0.22, r * 0.13, 0, Math.PI * 2);
  ctx.fill();
  // 笑嘴
  ctx.strokeStyle = '#2c2c2c'; ctx.lineWidth = Math.max(1.4, r * 0.07); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(0, r * 0.18, r * 0.18, 0.25, Math.PI - 0.25);
  ctx.stroke();
  // 小舌头
  ctx.fillStyle = '#ff7f7f';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.32, r * 0.07, r * 0.05, 0, 0, Math.PI * 2);
  ctx.fill();
}

// ================== 小图标版本 ==================
function drawTinyFruit(x, y, type, radius) {
  const f = FRUITS[type];
  if (spriteReady) {
    const dw = radius * 2.1;
    const dh = dw * (f.sh / f.sw);
    ctx.drawImage(spriteImg, f.sx, f.sy, f.sw, f.sh, x - dw/2, y - dh/2 + dh*0.04, dw, dh);
  } else {
    ctx.save();
    ctx.translate(x, y);
    const ratio = radius / f.r;
    ctx.scale(ratio, ratio);
    drawFruitBody(f.r, type, f);
    ctx.restore();
  }
}

function drawMyBin() {

  // 自然摇晃：双正弦波叠加 + 振幅衰减
  let sx = 0, sy = 0;
  if (me.shakeAmt > 0 && me.shakeMaxAmt > 0) {
    const decay = me.shakeAmt / me.shakeMaxAmt;
    sx = Math.sin(frame * 0.55) * decay * 14;
    sy = Math.sin(frame * 0.42 + 1.7) * decay * 4;
  }
  ctx.save();
  if (sx !== 0 || sy !== 0) ctx.translate(sx, sy);
  ctx.fillStyle = '#fffaeb';
  ctx.fillRect(MY_X, TOP_Y, BIN_W, FLOOR_Y - TOP_Y);
  ctx.strokeStyle = '#0984e3'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(MY_X - 1, TOP_Y - 8); ctx.lineTo(MY_X - 1, FLOOR_Y);
  ctx.lineTo(MY_X + BIN_W + 1, FLOOR_Y); ctx.lineTo(MY_X + BIN_W + 1, TOP_Y - 8);
  ctx.stroke();
  // 封顶线（红虚线）
  ctx.strokeStyle = '#e74c3c';
  ctx.setLineDash([6, 5]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(MY_X + 4, TOP_Y); ctx.lineTo(MY_X + BIN_W - 4, TOP_Y); ctx.stroke();
  ctx.setLineDash([]);
  // "封顶线" label
  ctx.fillStyle = 'rgba(231,76,60,0.7)'; ctx.font = '9px sans-serif';
  ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  ctx.fillText('封顶线', MY_X + BIN_W - 6, TOP_Y - 2);

  // 摇晃免疫期：把红线变紫 + 安全期提示
  if (me.shakeImmune > 0 && me.alive) {
    ctx.strokeStyle = '#6c5ce7';
    ctx.setLineDash([5, 4]); ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(MY_X + 4, TOP_Y); ctx.lineTo(MY_X + BIN_W - 4, TOP_Y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#6c5ce7';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🌀 摇晃安全期', MY_X + BIN_W / 2, TOP_Y - 18);
  }
  for (const f of me.fruits) drawCuteFruit(f.x, f.y, f.type, {
    flash: f.mergeFlash, blink: f.blink,
    squash: f.squash, rot: f.rot, breath: f.breath, mergeScale: f.mergeScale
  });
  ctx.restore();

  if (me.alive && phase === 'playing') {
    const fr = FRUITS[me.currentType].r;
    drawCuteFruit(me.currentX, DROP_Y, me.currentType, {
      alpha: 0.92, breath: frame * 0.06
    });
    ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.setLineDash([3, 6]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(me.currentX, DROP_Y + fr + 2); ctx.lineTo(me.currentX, FLOOR_Y - 4); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 左：玩家信息
  ctx.fillStyle = '#0984e3'; ctx.font = 'bold 13px sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.fillText(`${myAvatar} 我`, MY_X + 4, 6);
  ctx.fillStyle = '#2d3436'; ctx.font = 'bold 18px sans-serif';
  ctx.fillText(`${me.score}`, MY_X + 4, 22);

  // 右：下一个水果预览框（固定大小，避免大水果遮挡文字）
  const boxW = 70, boxH = 40;
  const boxX = MY_X + BIN_W - boxW - 2;
  const boxY = 4;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#ffd6a0';
  ctx.lineWidth = 1.5;
  if (ctx.roundRect) {
    ctx.beginPath(); ctx.roundRect(boxX, boxY, boxW, boxH, 8); ctx.fill(); ctx.stroke();
  } else {
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeRect(boxX, boxY, boxW, boxH);
  }
  ctx.fillStyle = '#95a5a6'; ctx.font = '9px sans-serif'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText('下一个', boxX + 6, boxY + 3);
  // 固定半径绘制预览水果（轻微呼吸）
  drawCuteFruit(boxX + boxW - 18, boxY + boxH/2 + 2, me.nextType, {
    radius: 13, alpha: 0.95, breath: frame * 0.05
  });

  // 5连发剩余次数标记（如果有 comboQueue）
  if (me.comboQueue && me.comboQueue.length > 0) {
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(boxX + boxW - 4, boxY + 4, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.font = 'bold 10px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(me.comboQueue.length + 1, boxX + boxW - 4, boxY + 5);
  }

  if (!me.alive) {
    ctx.fillStyle = `rgba(45,52,54,0.78)`;
    ctx.fillRect(MY_X, TOP_Y, BIN_W, FLOOR_Y - TOP_Y);
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 32px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const cy = (TOP_Y + FLOOR_Y) / 2; const wobble = Math.sin(frame * 0.2) * 4;
    ctx.fillText('💥', MY_X + BIN_W/2 - 60, cy + wobble);
    ctx.fillText('💥', MY_X + BIN_W/2 + 60, cy + wobble);
    ctx.fillStyle = 'white'; ctx.font = 'bold 36px sans-serif';
    ctx.fillText('出   局', MY_X + BIN_W/2, cy);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#ffeaa7';
    ctx.fillText('水果中心越过红线', MY_X + BIN_W/2, cy + 36);
  }
}

function drawMiniBin(x, y) {
  ctx.fillStyle = '#fffaeb'; ctx.fillRect(x, y, MINI_W, MINI_H);
  ctx.strokeStyle = '#d63031'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, MINI_W, MINI_H);
  ctx.strokeStyle = 'rgba(214,48,49,0.5)'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + MINI_W, y); ctx.stroke();
  ctx.setLineDash([]);
  for (const f of opp.fruits) {
    const localX = (f.x - MY_X) * MINI_SCALE;
    const localY = (f.y - TOP_Y) * MINI_SCALE;
    const r = FRUITS[f.type].r * MINI_SCALE;
    ctx.fillStyle = FRUITS[f.type].body;
    ctx.beginPath(); ctx.arc(x + localX, y + localY, r, 0, Math.PI * 2); ctx.fill();
  }
  if (!opp.alive) {
    ctx.fillStyle = 'rgba(45,52,54,0.78)';
    ctx.fillRect(x, y, MINI_W, MINI_H);
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('💥 出局', x + MINI_W/2, y + MINI_H/2);
  }
}

function drawMergePath(x, yStart, w) {
  // 标题
  ctx.fillStyle = '#636e72'; ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('合成路线', x + w/2, yStart);
  ctx.fillStyle = '#95a5a6'; ctx.font = '9px sans-serif';
  ctx.fillText('从小到大', x + w/2, yStart + 14);

  // 2 行 5 列
  const cols = 5;
  const rowH = 30;
  const cellW = w / cols;
  const fruitR = 9;
  const baseY = yStart + 32;

  for (let i = 0; i < FRUITS.length; i++) {
    const col = i % cols;
    const row = Math.floor(i / cols);
    const cx = x + col * cellW + cellW/2;
    const cy = baseY + row * rowH;
    drawTinyFruit(cx, cy, i, fruitR);
    // 行内箭头
    if (col < cols - 1) {
      ctx.fillStyle = '#bdc3c7'; ctx.font = '10px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('→', cx + cellW/2, cy);
    }
    // 第一行末尾到第二行开头：换行箭头
    if (i === cols - 1) {
      ctx.fillStyle = '#bdc3c7'; ctx.font = '9px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('↓', x + (cols - 1) * cellW + cellW/2, cy + rowH/2);
    }
  }
}

    // Big high-score badge
    const boxX = RC_X + 10, boxY = 56, boxW = RC_W - 20;

    ctx.strokeStyle = '#fdcb6e'; ctx.lineWidth = 2;
    ctx.strokeRect(boxX, boxY, boxW, 60);

    // Current score
    const sc2X = RC_X + 10, sc2Y = 130, sc2W = RC_W - 20;
    ctx.fillStyle = '#fff'; ctx.fillRect(sc2X, sc2Y, sc2W, 50);
    ctx.strokeStyle = '#0984e3'; ctx.lineWidth = 1.5; ctx.strokeRect(sc2X, sc2Y, sc2W, 50);
    ctx.fillStyle = '#95a5a6'; ctx.font = '9px sans-serif';
    ctx.fillText('本局得分', RC_X + RC_W/2, sc2Y + 4);
    ctx.fillStyle = '#2d3436'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText(me ? me.score : 0, RC_X + RC_W/2, sc2Y + 18);
    if (me && me.score > soloHighScore && me.score > 0) {
      ctx.fillStyle = '#fdcb6e'; ctx.font = 'bold 9px sans-serif';
      ctx.fillText('🔥 破纪录！', RC_X + RC_W/2, sc2Y + 40);
    }

    // Max fruit reached
    let by = 200;

  ctx.fillStyle = '#2d3436'; ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('对手画面', RC_X + RC_W/2, 18);
  if (oppConnected) {
    ctx.fillStyle = Math.floor(frame/30) % 2 === 0 ? '#e74c3c' : '#f8a5a5';
    ctx.beginPath(); ctx.arc(RC_X + 14, 24, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('LIVE', RC_X + 22, 20);
  }
  ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText(oppAvatar, RC_X + RC_W/2, 40);
  ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#d63031';
  ctx.fillText('对手', RC_X + RC_W/2, 90);
  ctx.fillStyle = '#fff'; ctx.fillRect(RC_X + 10, 115, RC_W - 20, 36);
  ctx.strokeStyle = '#d63031'; ctx.lineWidth = 1.5; ctx.strokeRect(RC_X + 10, 115, RC_W - 20, 36);
  ctx.fillStyle = '#95a5a6'; ctx.font = '9px sans-serif';
  ctx.fillText('得分', RC_X + RC_W/2, 119);
  ctx.fillStyle = '#2d3436'; ctx.font = 'bold 18px sans-serif';
  ctx.fillText(opp.score, RC_X + RC_W/2, 130);
  drawMiniBin(MINI_X, MINI_Y);
  let by = MINI_Y + MINI_H + 10;
  ctx.fillStyle = '#636e72'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('对手最大', RC_X + RC_W/2, by);
  ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#2d3436';

  // 合成路线说明（在对手信息下面）
  drawMergePath(RC_X + 4, by + 38, RC_W - 8);
}

function drawParticles() {
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = p.life / p.max;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function draw() {
  ctx.fillStyle = '#fffbf0'; ctx.fillRect(0, 0, W, H);
  if (!me) return;
  drawMyBin(); drawRightCol(); drawParticles();
  if (phase === 'countdown') {
    ctx.fillStyle = 'rgba(45,52,54,0.78)'; ctx.fillRect(0, 0, W, H);
    const ms = countdownEnd - performance.now(); const sec = ms / 1000;
    ctx.fillStyle = 'white'; ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('准备开始 · 一局 4 分钟', W/2, H/2 - 90);
    let label;
    if (sec > 2.5) label = '3'; else if (sec > 1.5) label = '2';
    else if (sec > 0.5) label = '1'; else label = '开 始 !';
    const scale = 1 + 0.15 * Math.sin(sec * Math.PI * 2);
    ctx.save();
    ctx.translate(W/2, H/2 + 10); ctx.scale(scale, scale);
    ctx.fillStyle = label === '开 始 !' ? '#00b894' : 'white';
    ctx.font = `bold ${label === '开 始 !' ? 56 : 110}px sans-serif`;
    ctx.fillText(label, 0, 0);
    ctx.restore();
  }
}

function drawVictoryOverlay() {
  if (victoryAnim <= 0) return;
  // 黄色渐进遮罩
  const a = victoryAnim;
  ctx.fillStyle = `rgba(45, 52, 54, ${0.55 * a})`;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 放射光线
  ctx.save();
  ctx.translate(240, 340);
  ctx.rotate(frame * 0.005);
  const numRays = 16;
  ctx.fillStyle = `rgba(253, 203, 110, ${0.35 * a})`;
  for (let i = 0; i < numRays; i++) {
    ctx.save();
    ctx.rotate((i / numRays) * Math.PI * 2);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-30, 350);
    ctx.lineTo(30, 350);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // 切开西瓜（脉动+旋转）
  const scale = 0.3 + a * 0.95 + Math.sin(frame * 0.1) * 0.05;
  const cwR = 130 * scale;
  ctx.save();
  ctx.translate(240, 340);
  const wobble = Math.sin(frame * 0.15) * 0.06;
  ctx.rotate(wobble);
  drawCutWatermelon(0, 0, cwR);
  ctx.restore();

  // 文字
  ctx.save();
  ctx.translate(240, 200);
  const txtScale = 0.5 + a * 0.5 + Math.sin(frame * 0.1) * 0.03;
  ctx.scale(txtScale, txtScale);
  ctx.fillStyle = '#fdcb6e';
  ctx.font = 'bold 56px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.fillText('🏆 胜利!', 0, 0);
  ctx.restore();

  // 撒花
  for (const p of victoryParticles) {
    const lifeFrac = p.life / p.max;
    ctx.save();
    ctx.globalAlpha = Math.min(1, lifeFrac * 1.5);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.r, -p.r * 0.4, p.r * 2, p.r * 0.8);
    ctx.restore();
  }

  // 提示 tap
  if (a > 0.85) {
    const blink = (Math.sin(frame * 0.15) + 1) / 2;
    ctx.fillStyle = `rgba(255, 255, 255, ${0.4 + blink * 0.4})`;
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('👆 点击屏幕回到大厅', 240, 560);
  }
}

function drawSpriteDebug() {
  if (!DEBUG_SPRITES || !spriteReady) return;
  const dispW = 280;
  const scale = dispW / spriteImg.width;
  const dispH = spriteImg.height * scale;
  const ox = canvas.width - dispW - 6;
  const oy = 6;
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.97)';
  ctx.fillRect(ox - 3, oy - 3, dispW + 6, dispH + 50);
  ctx.drawImage(spriteImg, 0, 0, spriteImg.width, spriteImg.height, ox, oy, dispW, dispH);
  // 红框 + 水果名 + 序号
  ctx.lineWidth = 1.5;
  ctx.font = 'bold 9px sans-serif';
  for (let i = 0; i < FRUITS.length; i++) {
    const f = FRUITS[i];
    ctx.strokeStyle = 'red';
    ctx.strokeRect(ox + f.sx * scale, oy + f.sy * scale, f.sw * scale, f.sh * scale);
    // 标签放在框左上方，背景色让它清楚
    const label = `${i}.${f.name}`;
    const tw = ctx.measureText(label).width + 4;
    ctx.fillStyle = 'rgba(255,255,0,0.85)';
    ctx.fillRect(ox + f.sx * scale, oy + f.sy * scale - 11, tw, 11);
    ctx.fillStyle = '#a00';
    ctx.fillText(label, ox + f.sx * scale + 2, oy + f.sy * scale - 2);
  }
  // 蓝框：切开西瓜
  ctx.strokeStyle = 'blue';
  ctx.strokeRect(ox + CUT_MELON_SPRITE.sx * scale, oy + CUT_MELON_SPRITE.sy * scale,
    CUT_MELON_SPRITE.sw * scale, CUT_MELON_SPRITE.sh * scale);
  const tw2 = ctx.measureText('胜利:切瓜').width + 4;
  ctx.fillStyle = 'rgba(180,200,255,0.85)';
  ctx.fillRect(ox + CUT_MELON_SPRITE.sx * scale, oy + CUT_MELON_SPRITE.sy * scale - 11, tw2, 11);
  ctx.fillStyle = '#00a';
  ctx.fillText('胜利:切瓜', ox + CUT_MELON_SPRITE.sx * scale + 2, oy + CUT_MELON_SPRITE.sy * scale - 2);
  // 状态信息
  ctx.fillStyle = '#000';
  ctx.font = 'bold 10px sans-serif';
  const status = autoDetected ? '✓ 自动校准成功' : '⚠ 未自动校准（手动坐标）';
  ctx.fillText(`图片: ${spriteImg.naturalWidth}×${spriteImg.naturalHeight}`, ox, oy + dispH + 12);
  ctx.fillText(status, ox, oy + dispH + 26);
  ctx.font = '9px sans-serif';
  ctx.fillText(autoDetectInfo || '(等待检测)', ox, oy + dispH + 40);
  ctx.restore();
}

function loop() { update(); draw(); drawVictoryOverlay(); drawSpriteDebug(); requestAnimationFrame(loop); }

initNetwork();
loop();

})();
</script>
